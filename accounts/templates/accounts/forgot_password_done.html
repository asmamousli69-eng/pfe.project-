{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email sent - Cerist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            max-width: 180px;
            height: auto;
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 36px;
            color: #000;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .message {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn-back {
            display: inline-block;
            padding: 15px 40px;
            background: #1e40af;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: #1e3a8a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="{% static 'images/cerist_logo.png' %}" alt="Cerist Logo">
        </div>

        <div class="success-icon"><i class="bi bi-envelope-check-fill"></i></div>
        
       <h1>Email sent</h1>

<p class="message">
    Check your email. We've sent you a link to reset your password.
</p>

<a href="{% url 'accounts:login' %}" class="btn-back">← Back to login</a>            </div>
</body>
</html>
