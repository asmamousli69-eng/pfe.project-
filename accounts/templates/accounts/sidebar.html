{% load static %}
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="side-bar">
    <div class="logo">
        <img src="{% static 'images/cerist_logo.png' %}" alt="Cerist">
    </div>

    <nav>
        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="bi bi-grid" style="font-size: 24px;"></i>
            <span>Dashboard</span>
        </a>

        <!-- Scraping -->
        <a href="{% url 'scraping_page' %}" class="{% if request.resolver_match.url_name == 'scraping_page' %}active{% endif %}">
            <i class="bi bi-arrow-repeat" style="font-size: 24px;"></i>
            <span>Scraping</span>
        </a>

        <!-- Database -->
        <a href="{% url 'conference_list' %}" class="{% if request.resolver_match.url_name == 'conference_list' %}active{% endif %}">
            <i class="bi bi-database" style="font-size: 24px;"></i>
            <span>Database</span>
        </a>

        <!-- Reset Requests - Only for Superusers -->
        {% if request.user.is_superuser %}
        <a href="{% url 'accounts:password_reset_requests' %}" 
           class="{% if request.resolver_match.url_name == 'password_reset_requests' %}active{% endif %}">
            <i class="bi bi-key" style="font-size: 24px;"></i>
            <span>Reset Requests</span>
        </a>
        {% endif %}

        <!-- Admin Panel - Only for Staff -->
        {% if request.user.is_staff %}
        <a href="{% url 'accounts:admin_dashboard' %}" 
           class="admin-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2" style="font-size: 24px;"></i>
            <span>Admin Panel</span>
        </a>
        {% endif %}
    </nav>
</div>
