{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account - Cerist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background:#f8f9fa;
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        .logo {
            text-align: left;
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 180px;
            height: auto;
        }
        h1 {
            font-size: 36px;
            color: #000;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .subtitle {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            color: #1e3a8a;
            font-size: 20px;
        }
        input {
            width: 100%;
            padding: 18px 20px 18px 60px;
            border: 1px solid #d1d5db;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        input:focus {
            outline: none;
            border-color: #1e40af;
        }
        input::placeholder {
            color: #9ca3af;
        }
        .btn-signup {
            width: 100%;
            padding: 18px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-signup:hover {
            background: #1e3a8a;
            transform: translateY(-2px);
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 16px;
        }
        .login-link a {
            color: #1e40af;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #dc2626;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="{% static 'images/cerist_logo.png' %}" alt="Cerist Logo">
        </div>

        <h1>Create an account</h1>
        <p class="subtitle">Sign up to get started</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="input-group">
                <div class="input-icon"><i class="bi bi-person-circle"></i></div>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <div class="input-icon"><i class="bi bi-envelope-fill"></i></div>
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <div class="input-icon"><i class="bi bi-lock-fill"></i></div>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <div class="input-icon"><i class="bi bi-lock-fill"></i></div>
                <input type="password" name="confirm" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-signup">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="{% url 'accounts:login' %}">login</a>
        </div>
    </div>
</body>
</html>
