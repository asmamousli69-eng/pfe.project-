{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - Cerist</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background:#f8f9fa;
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        .logo {
             text-align: left;
             margin-bottom: 30px;
        }
        .logo img {
            max-width: 180px;
            height: auto;
        }
        h1 {
            font-size: 36px;
            color: #000;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .subtitle {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #1e3a8a;
            font-size: 20px;
        }
        input {
            width: 100%;
            padding: 18px 20px 18px 60px;
            border: 1px solid #d1d5db;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        input:focus {
            outline: none;
            border-color: #1e40af;
        }
        input::placeholder {
            color: #9ca3af;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 15px;
        }
        .back-link:hover {
            color: #1e40af;
        }
        .resend-link {
            color: #1e40af;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }
        .resend-link:hover {
            text-decoration: underline;
        }
        .btn-send {
            width: 100%;
            padding: 18px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-send:hover {
            background: #1e3a8a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="{% static 'images/cerist_logo.png' %}" alt="Cerist Logo">
        </div>

        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your email to get the reset link</p>

        <form method="post">
            {% csrf_token %}
            
            <div class="input-group">
                <div class="input-icon"><i class="bi bi-envelope-fill"></i></div>
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="actions">
                <a href="{% url 'accounts:login' %}" class="back-link">← Back to login</a>
                <a href="#" class="resend-link">Resend link</a>
            </div>

            <button type="submit" class="btn-send">Send</button>
        </form>
    </div>
</body>
</html>
