{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Conference - Cerist</title>
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 900px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 180px;
        }
        h1 {
            text-align: center;
            font-size: 32px;
            color: #173E8F;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #1f2937;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-decoration: none;
            text-align: center;
        }
        .btn-cancel {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-cancel:hover {
            background: #f9fafb;
        }
        .btn-submit {
            background:  #1e3a8a;
            color: white;
        }
        .btn-submit:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="modal">
        <div class="logo">
            <img src="{% static 'images/cerist_logo.png' %}" alt="Cerist">
        </div>
        
        <h1>Add New Conference</h1>
        <p class="subtitle">Enter conference details</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="id_name">Conference Name</label>
                    <input type="text" name="name" id="id_name" placeholder="Enter conference name" required>
                </div>
                
                <div class="form-group">
                    <label for="id_domain">Domain</label>
                    <input type="text" name="domain" id="id_domain" placeholder="Enter conference domain" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="id_date">Date</label>
               <input type="date" name="date" id="id_date" required>
                </div>
                
                <div class="form-group">
                    <label for="id_location">Place</label>
                    <input type="text" name="location" id="id_location" placeholder="City, Country" required >
                </div>
            </div>
            
             <div class="form-group">
                <label>Audience</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="audience" value="national" checked>
                        <span>National</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="audience" value="international">
                        <span>International</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group full-width checkbox-group">
                <input type="checkbox" name="acts" id="id_acts" {% if conference.acts %}checked{% endif %}>
                <label for="id_acts">Has Acts </label>
            </div>
             
            
            <div class="form-group full-width" id="acts-description" style="display: none;">
                <label for="id_acts_text">Describe Acts</label>
                <textarea name="acts_text" id="id_acts_text" placeholder="Describe conference activities (keynotes, workshops, etc.)"></textarea>
            </div>
            
            
            <div class="button-group">
                <a href="{% url 'conference_list' %}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Save Changes</button>
            </div>
        </form>
    </div>
    <script>
        // Show/hide acts description textarea based on checkbox
        document.querySelector('input[name="acts"]').addEventListener('change', function(e) {
            const actsDescription = document.getElementById('acts-description');
            const actsTextarea = document.getElementById('id_acts_text');
            
            if (e.target.checked) {
                actsDescription.style.display = 'block';
                actsTextarea.required = true;
            } else {
                actsDescription.style.display = 'none';
                actsTextarea.required = false;
                actsTextarea.value = '';
            }
        });

        // Optional: Validate that acts text is provided when checkbox is checked
        document.querySelector('form').addEventListener('submit', function(e) {
            const actsCheckbox = document.querySelector('input[name="acts"]');
            const actsText = document.getElementById('id_acts_text').value;
            
            if (actsCheckbox.checked && !actsText.trim()) {
                e.preventDefault();
                alert('Please describe the acts since you selected "Has Acts"');
                document.getElementById('id_acts_text').focus();
            }
        });
    </script>
</body>
</html>
