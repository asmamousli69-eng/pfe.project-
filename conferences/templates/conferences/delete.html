<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Conference</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
           
        
        }

        .delete-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
             box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 900px;
            width: 100%;
            padding: 40px 60px;
        }

        /* Warning Icon */
        .warning-icon {
            width: 70px;
            height: 70px;
            background: #fff3f3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .warning-icon svg {
            width: 35px;
            height: 35px;
            fill: #ff4757;
        }

        h1 {
            color: #173E8F;
            font-size: 32px;
            font-weight: 650;
            text-align: center;
            margin-bottom: 15px;
        }

        .warning-text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        /* Conference Details Card */
        .conference-details {
            background: #f8faff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .detail-row {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e7f0;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            width: 120px;
            font-weight: 600;
            color: #173E8F;
        }

        .detail-value {
            flex: 1;
            color: #333;
        }

        /* Warning Message */
        .danger-warning {
            background: #fff3f3;
            border-left: 4px solid #ff4757;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .danger-warning svg {
            width: 24px;
            height: 24px;
            fill: #ff4757;
        }

        .danger-warning span {
            color: #ff4757;
            font-weight: 500;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-cancel {
            background: #e0e7f0;
            color: #173E8F;
        }

        .btn-cancel:hover {
            background: #d1dae5;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
        }

        .btn-delete:hover {
            background: #ff2f2f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .btn-delete:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <!-- Warning Icon -->
        <div class="warning-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>

        <h1>Delete Conference?</h1>
        <p class="warning-text">Are you sure you want to delete this conference?</p>

        <!-- Conference Details -->
        <div class="conference-details">
            <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value">{{ conference.name }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Domain:</span>
                <span class="detail-value">{{ conference.domain }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Date:</span>
                <span class="detail-value">{{ conference.date|date:"Y-m-d" }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Place:</span>
                <span class="detail-value">{{ conference.location }}</span>
            </div>
        </div>

        <!-- Danger Warning -->
        <div class="danger-warning">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <span> This action cannot be undone.</span>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <a href="{% url 'conference_list' %}" class="btn btn-cancel">Cancel</a>
            <form method="POST" action="{% url 'delete_conference' conference.id %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete">Delete</button>
            </form>
        </div>
    </div>
</body>
</html>
